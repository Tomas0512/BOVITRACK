# ══════════════════════════════════════════════════════════════
# BoviTrack — Análisis estático con SonarQube Cloud (SonarCloud)
#
# What?    Le dice al escáner qué parte del monorepo inspeccionar y bajo qué
#          proyecto de SonarCloud publicar los resultados.
# ¿Para?   Detectar bugs, vulnerabilidades, security hotspots, código duplicado
#          y deuda técnica en cada push y pull request, sin ejecutar el código.
# Impact?  Si projectKey u organization no coinciden con los de SonarCloud, el
#          análisis crea un proyecto nuevo en lugar de alimentar el existente.
# ══════════════════════════════════════════════════════════════

sonar.projectKey=BOVITRACK_TOMAS1594
sonar.organization=tomas0512
sonar.projectName=BOVITRACK

# ── Qué se inspecciona ────────────────────────────────────────
# Código de producción de los tres frentes del monorepo.
sonar.sources=be/app,fe/src,mobile/src,db

# Las pruebas se indexan aparte: sus reglas son distintas y no cuentan
# como código de producción en las métricas de deuda técnica.
sonar.tests=be/tests
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

# ── Qué se ignora ─────────────────────────────────────────────
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/__pycache__/**,**/.venv/**,**/assets/**,**/*.min.js,**/*.lock

# ── Reportes de cobertura ─────────────────────────────────────
# Los genera el propio workflow antes de lanzar el escaner. Sin estas rutas
# SonarCloud reporta 0 % aunque el proyecto tenga pruebas, porque la
# cobertura no se deduce del codigo: hay que medirla ejecutandolo.
sonar.python.coverage.reportPaths=be/coverage.xml
sonar.javascript.lcov.reportPaths=fe/coverage/lcov.info

# ── Metadatos del lenguaje ────────────────────────────────────
sonar.python.version=3.12
sonar.sourceEncoding=UTF-8
