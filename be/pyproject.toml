[project]
name = "bovitrack-be"
version = "1.0.0"
requires-python = ">=3.12"

dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "sqlalchemy==2.0.36",
    "alembic==1.13.3",
    "psycopg2-binary==2.9.9",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "python-multipart==0.0.12",
    "pydantic-settings==2.5.2",
    "pydantic[email]==2.9.2",
    "python-dotenv==1.0.1",
    "slowapi==0.1.9",
    "resend==2.25.0",
    "openpyxl==3.1.5",
    "reportlab==4.2.5",
]

[dependency-groups]
dev = [
    "pytest==8.3.3",
    "pytest-cov==5.0.0",
    "httpx==0.27.2",
    "ruff==0.6.9",
]

# ══════════════════════════════════════════════════════════════
# What?    Declara que este proyecto no publica paquetes Python propios.
# ¿Para?   `pip install .` se usa aqui solo para resolver e instalar las
#           dependencias, no para empaquetar la aplicacion. Sin esta linea,
#           setuptools intenta descubrir paquetes automaticamente y falla
#           con "Multiple top-level packages discovered in a flat-layout"
#           al encontrar `app`, `alembic` y `storage` juntos.
# Impact?  La aplicacion se importa desde el directorio de trabajo (asi la
#           usan uvicorn, alembic y pytest), no desde site-packages. El
#           Dockerfile tambien depende de esto: en la etapa builder solo
#           copia pyproject.toml, sin codigo.
# ══════════════════════════════════════════════════════════════
[tool.setuptools]
py-modules = []
