[project]
name = "bovitrack-be"
version = "1.0.0"
requires-python = ">=3.12"

dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "sqlalchemy==2.0.36",
    "alembic==1.13.3",
    "psycopg2-binary==2.9.9",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "python-multipart==0.0.12",
    "pydantic-settings==2.5.2",
    "pydantic[email]==2.9.2",
    "python-dotenv==1.0.1",
    "slowapi==0.1.9",
    "resend==2.25.0",
    "openpyxl==3.1.5",
    "reportlab==4.2.5",
]

[dependency-groups]
dev = [
    "pytest==8.3.3",
    "pytest-cov==5.0.0",
    "httpx==0.27.2",
    "ruff==0.6.9",
    "import-linter==2.1",
]

# El backend es una APLICACIÓN, no una librería: `pip install .` solo instala las
# dependencias. Sin esto, setuptools encontraba app/ y alembic/ y no sabía cuál
# empaquetar ("Multiple top-level packages"); solo funcionaba en el Dockerfile
# porque allí se instala antes de copiar el código.
[tool.setuptools]
packages = []
py-modules = []

# ══════════════════════════════════════════════════════════════
# Fronteras arquitectónicas (import-linter)
#
# ¿Qué?    Contratos que dicen qué paquete puede importar a cuál.
# ¿Para?   Que las fronteras del monolito modular no dependan de la
#          disciplina de cada desarrollador: se verifican con `lint-imports`.
# ¿Impacto? Si un cambio rompe una frontera (p. ej. core importando un
#          modelo de dominio), el chequeo falla y dice qué import la rompe.
# ══════════════════════════════════════════════════════════════
[tool.importlinter]
root_package = "app"
include_external_packages = true
# Los imports dentro de `if TYPE_CHECKING:` solo existen para el chequeo de tipos
# (p. ej. relaciones ORM por nombre); no crean acoplamiento en ejecución.
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "shared es Python puro (no depende de la app, ni de FastAPI ni de SQLAlchemy)"
type = "forbidden"
source_modules = ["app.shared"]
forbidden_modules = [
    "app.core",
    "app.modules",
    "app.models",
    "app.main",
    "fastapi",
    "sqlalchemy",
]

[[tool.importlinter.contracts]]
name = "core no depende del dominio"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = [
    "app.modules",
    "app.models",
    "app.main",
]

# ── Contratos de los módulos de dominio (app/modules) ─────────────
# Al crear un módulo nuevo se agrega a las listas de estos contratos y, en
# "capas de módulos", en el nivel que le corresponda según de quién depende.

[[tool.importlinter.contracts]]
name = "capas dentro de cada módulo: router -> dependencies -> service -> schemas -> repository -> models"
type = "layers"
containers = [
    "app.modules.audit",
    "app.modules.team",
    "app.modules.identity",
    "app.modules.farms",
    "app.modules.notifications",
    "app.modules.reports",
    "app.modules.tasks",
    "app.modules.economics",
    "app.modules.milk_production",
    "app.modules.reproduction",
    "app.modules.documents",
    "app.modules.health",
    "app.modules.livestock",
    "app.modules.inventory",
]
# Entre paréntesis: capas opcionales (solo algunos módulos las tienen).
#   scheduler  -> tarea programada que arma el servicio (notifications)
#   file_rules -> reglas puras sobre el contenido de archivos (documents)
#   exporters  -> formato de salida Excel/PDF (reports)
#   storage    -> adaptador de almacenamiento de archivos (documents)
#   models     -> reports no tiene tablas propias (es un modelo de lectura)
layers = [
    "router",
    "(scheduler)",
    "dependencies",
    "service",
    "(file_rules)",
    "(exporters)",
    "schemas",
    "(storage)",
    "repository",
    "(models)",
]

[[tool.importlinter.contracts]]
name = "servicios de los módulos sin FastAPI ni SQLAlchemy"
type = "forbidden"
source_modules = [
    "app.modules.audit.service",
    "app.modules.notifications.service",
    "app.modules.reports.service",
    "app.modules.tasks.service",
    "app.modules.economics.service",
    "app.modules.milk_production.service",
    "app.modules.reproduction.service",
    "app.modules.documents.service",
    "app.modules.health.service",
    "app.modules.livestock.service",
    "app.modules.inventory.service",
    "app.modules.identity.service",
    "app.modules.farms.service",
    "app.modules.team.service",
]
forbidden_modules = [
    "fastapi",
    "sqlalchemy",
]
# El servicio usa el repositorio, que sí usa SQLAlchemy: eso está permitido.
# Lo prohibido es que el servicio importe SQLAlchemy por sí mismo.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "módulos independientes salvo por composición: solo dependencies.py importa otro módulo, y solo su API pública"
type = "independence"
modules = [
    "app.modules.audit",
    "app.modules.team",
    "app.modules.identity",
    "app.modules.farms",
    "app.modules.notifications",
    "app.modules.reports",
    "app.modules.tasks",
    "app.modules.economics",
    "app.modules.milk_production",
    "app.modules.reproduction",
    "app.modules.documents",
    "app.modules.health",
    "app.modules.livestock",
    "app.modules.inventory",
]
# Única excepción permitida: el dependencies.py de un módulo puede importar la
# RAÍZ de otro módulo (app.modules.<otro>), que es su API pública. El comodín *
# cubre un solo nivel, así que importar app.modules.<otro>.repository (un
# interno) sigue rompiendo el contrato.
ignore_imports = ["app.modules.*.dependencies -> app.modules.*"]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "capas de módulos (sin ciclos): consumidores -> health -> inventory -> livestock -> farms -> identity"
type = "layers"
# Un módulo solo puede usar módulos de niveles INFERIORES. Los del mismo nivel
# (separados por |) no se usan entre sí. Así nunca puede formarse un ciclo.
layers = [
    "app.modules.audit | app.modules.team | app.modules.notifications | app.modules.reports | app.modules.tasks | app.modules.economics | app.modules.milk_production | app.modules.reproduction | app.modules.documents",
    "app.modules.health",
    "app.modules.inventory",
    "app.modules.livestock",
    # Fincas, lotes, potreros y catálogos. Solo usa a identity.
    "app.modules.farms",
    # Base: usuarios, autenticación, roles, permisos y membresías. No usa a nadie.
    "app.modules.identity",
]

[[tool.importlinter.contracts]]
name = "API pública de los módulos: main, core, shared y el registro de modelos solo importan app.modules.<modulo>"
type = "forbidden"
source_modules = [
