# ══════════════════════════════════════════════════════════════
# BoviTrack — Encabezados de seguridad de la web (Parte 6b-2)
#
# What?    Encabezados que el navegador aplica a la SPA: qué puede cargar la
#          página (CSP), que no se meta en un iframe ajeno, que no adivine
#          tipos de archivo y qué APIs del dispositivo puede pedir.
# ¿Para?   Defensa en profundidad: si algún día se cuela un XSS, la CSP impide
#          ejecutar scripts de otros orígenes o mandar datos a otro servidor.
# Impact?  Se incluye en CADA location que sirve archivos de la web: en nginx un
#          add_header dentro de un location anula los del bloque server. La API
#          (/api/) no lo incluye: FastAPI ya pone sus propios encabezados.
#          `always` también los manda en respuestas de error (404...).
#
# CSP, directiva por directiva:
#   default-src 'self'          por defecto solo el mismo origen.
#   script-src 'self'           sin scripts en línea ni de otros dominios (el
#                               build de Vite solo genera /assets/*.js).
#   style-src 'self'            el CSS sale de /assets. Sin 'unsafe-inline': React,
#                               Recharts y Chart.js ponen estilos por JavaScript
#                               (element.style), que la CSP permite; nadie inyecta
#                               <style> ni atributos style="" en HTML. Probado en
#                               todas las pantallas sin ninguna violación (6b-2).
#   img-src 'self' data: blob: https://images.unsplash.com
#                               imágenes propias, SVG/miniaturas en data: y
#                               blob:, y la foto de fondo del layout (Unsplash).
#   connect-src 'self'          las llamadas a la API van a /api del mismo origen.
#   font-src 'self' data:       sin fuentes externas.
#   object-src 'none'           sin plugins (<object>, <embed>).
#   base-uri 'self'; form-action 'self'; frame-ancestors 'none'
#                               nadie cambia la base de las URLs, los formularios
#                               solo van a este sitio y nadie lo mete en un iframe.
#
# Si se agrega un recurso externo (una fuente, un mapa, un CDN), hay que
# agregar su origen aquí; si no, el navegador lo bloquea y lo avisa en la consola.
# HSTS (Strict-Transport-Security) va en el proxy con HTTPS que está delante,
# no aquí: nginx solo habla HTTP y el navegador lo ignora sin TLS.
# ══════════════════════════════════════════════════════════════
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://images.unsplash.com; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
