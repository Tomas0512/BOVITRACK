server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: redirige todas las rutas a index.html
    # index.html nunca se cachea: el navegador siempre revalida (evita bundle viejos).
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Assets con hash de contenido (index-<hash>.js, etc.): cache largo e inmutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Imágenes (mapa aéreo): revalidar siempre para ver cambios sin limpiar caché.
    location /imagenes/ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy de la API al backend
    location /api/ {
        proxy_pass http://be:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
