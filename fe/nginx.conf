server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # No revelar la versión de nginx y comprimir texto (JS, CSS, JSON de la API).
    server_tokens off;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # SPA: redirige todas las rutas a index.html
    # index.html nunca se cachea: el navegador siempre revalida (evita bundle viejos).
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Assets con hash de contenido (index-<hash>.js, etc.): cache largo e inmutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Imágenes (mapa aéreo): revalidar siempre para ver cambios sin limpiar caché.
    location /imagenes/ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy de la API al backend
    location /api/ {
        # Acepta el límite de 50 MiB del backend más el overhead del multipart.
        client_max_body_size 51m;
        proxy_pass http://be:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # IP real del cliente para el rate limiting del backend (uvicorn --proxy-headers).
        # Se SOBRESCRIBE (no se agrega a lo que mande el cliente) para que nadie pueda
        # falsificarla enviando su propio X-Forwarded-For.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
