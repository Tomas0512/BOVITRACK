server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # IP real del cliente cuando hay OTRO proxy delante (Caddy, Cloudflare, el
    # balanceador del proveedor). Sin esto, nginx ve la IP de ese proxy y el límite
    # de intentos de login y los eventos SECURITY verían a todos como uno solo.
    # Activar SOLO con la IP o el rango de ESE proxy: con 0.0.0.0/0 cualquiera
    # podría falsificar su IP mandando su propio X-Forwarded-For.
    # (Detalle: docs/DESPLIEGUE_Y_INFRAESTRUCTURA.md, sección 1.1.)
    # set_real_ip_from 172.16.0.0/12;      # p. ej. Caddy en la misma red Docker
    # real_ip_header X-Forwarded-For;      # Cloudflare: CF-Connecting-IP
    # real_ip_recursive on;

    # No revelar la versión de nginx y comprimir texto (JS, CSS, JSON de la API).
    server_tokens off;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # SPA: redirige todas las rutas a index.html
    # index.html nunca se cachea: el navegador siempre revalida (evita bundle viejos).
    # Cada location que sirve la web incluye los encabezados de seguridad (CSP, etc.):
    # un add_header dentro de un location anula los heredados del server.
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Assets con hash de contenido (index-<hash>.js, etc.): cache largo e inmutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Imágenes (mapa aéreo): revalidar siempre para ver cambios sin limpiar caché.
    location /imagenes/ {
        add_header Cache-Control "no-cache, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # Proxy de la API al backend
    location /api/ {
        # Acepta el límite de 50 MiB del backend más el overhead del multipart.
        client_max_body_size 51m;
        proxy_pass http://be:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # IP real del cliente para el rate limiting del backend (uvicorn --proxy-headers).
        # Se SOBRESCRIBE (no se agrega a lo que mande el cliente) para que nadie pueda
        # falsificarla enviando su propio X-Forwarded-For.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
