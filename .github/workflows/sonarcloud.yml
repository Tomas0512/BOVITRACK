# ══════════════════════════════════════════════════════════════
# BoviTrack — Análisis estático de código (SonarQube Cloud)
#
# What?    En cada push a main y en cada pull request ejecuta las pruebas de
#          backend y frontend para medir cobertura, y después envía el código
#          y esos reportes a SonarCloud para su inspección.
# ¿Para?   Cumplir la Guía N.º 08 (SQA): medir bugs, vulnerabilidades, security
#          hotspots, duplicación, cobertura y deuda técnica.
# Nota:    La cobertura no se deduce leyendo el código; hay que ejecutarlo. Sin
#          los pasos de pruebas, SonarCloud reporta 0 % aunque haya pruebas.
# Impact?  Corre en paralelo a ci.yml; no lo reemplaza. ci.yml verifica que el
#          código funcione, este verifica cómo está escrito.
#
# Requiere: el secret SONAR_TOKEN en Settings > Secrets and variables > Actions,
#           y "CI-based analysis" activo en SonarCloud (Administration >
#           Analysis method). Si el "Automatic Analysis" queda encendido,
#           este job falla a propósito para no publicar dos veces.
# ══════════════════════════════════════════════════════════════
name: SonarCloud Analysis

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

# Una corrida nueva en la misma rama cancela la anterior (ahorra minutos).
concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Historial completo: Sonar lo necesita para fechar cada issue
          # (git blame) y para calcular qué es "código nuevo".
          fetch-depth: 0

      # ── Cobertura del backend ────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: be/pyproject.toml

      - name: Instalar dependencias del backend
        working-directory: be
        run: |
          python -m pip install --upgrade pip
          pip install . --group dev

      # Las pruebas del backend usan dobles (MagicMock) para la sesión de base
      # de datos, así que no hace falta levantar PostgreSQL. Las variables de
      # entorno solo existen para que la configuración de la app se pueda
      # instanciar al importarla; no apuntan a ningún entorno real.
      - name: Pruebas del backend con cobertura
        working-directory: be
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/bovitrack_ci
          SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789
          ENVIRONMENT: test
        run: python -m pytest -q -p no:cacheprovider --cov=app --cov-report=xml:coverage.xml --cov-report=term

      # ── Cobertura del frontend ───────────────────────────────
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          package_json_file: fe/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: fe/pnpm-lock.yaml

      - name: Instalar dependencias del frontend
        working-directory: fe
        run: pnpm install --frozen-lockfile

      - name: Pruebas del frontend con cobertura
        working-directory: fe
        run: pnpm test:coverage

      # ── Análisis ─────────────────────────────────────────────
      # La acción se fija por SHA completo y no por etiqueta: una etiqueta como
      # @v5 es móvil y quien controle ese repositorio puede reapuntarla a otro
      # commit. Como la acción recibe SONAR_TOKEN y lee todo el código, un
      # cambio así se ejecutaría aquí con acceso al secret.
      # El comentario deja legible qué versión es el SHA.
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
